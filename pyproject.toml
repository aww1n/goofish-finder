[project]
name = "goofish-finder"
version = "0.1.0"
description = "Production-oriented Telegram monitoring bot for Goofish"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.13,<4", "alembic>=1.13,<2", "asyncpg>=0.29,<1",
  "celery[redis]>=5.4,<6", "fastapi>=0.115,<1", "httpx>=0.27,<1",
  "playwright>=1.55,<2",
  "pydantic-settings>=2.5,<3", "sqlalchemy[asyncio]>=2.0.35,<3",
  "structlog>=24.4,<26", "uvicorn[standard]>=0.30,<1"
]

[project.optional-dependencies]
dev = ["aiosqlite>=0.20", "pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
